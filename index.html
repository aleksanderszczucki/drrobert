<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DrRobert – kalkulator rurarza i spawacza</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1118">
<style>
:root{--bg:#0b1118;--card:#111b27;--card2:#0d151e;--line:#223246;--tx:#e8eef5;--mu:#8a9bb0;--ac:#7ed957;--or:#f5a623;--bl:#5ab4ff;--rd:#ff5b5b}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(1200px 500px at 70% -100px,#12263a 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
button,select,input{font:inherit;color:var(--tx)}
header{position:sticky;top:0;z-index:10;background:rgba(11,17,24,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:8px}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;cursor:pointer;flex:1;background:none;border:0;padding:0;text-align:left}
.logo img{width:28px;height:28px;border-radius:7px}.logo span{color:var(--ac)}
.hb{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:14px}
.hb:hover{border-color:var(--ac)}
main{max-width:1080px;margin:0 auto;padding:0 16px 60px}
.hero{padding:40px 0 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;align-items:center}
.eyebrow{color:var(--ac);font-weight:800;letter-spacing:.14em;font-size:12px;text-transform:uppercase}
.hero h1{font-size:clamp(40px,8vw,72px);line-height:1;margin:10px 0 14px;font-weight:900;background:linear-gradient(#fff,#9fb2c7);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mu);font-size:18px;margin:0 0 16px;max-width:520px}.badge{color:var(--ac);font-weight:700;font-size:14px}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}
.btn{background:var(--ac);color:#08210a;border:0;border-radius:12px;padding:13px 20px;font-weight:800;cursor:pointer}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}.btn:hover{filter:brightness(1.1)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0 8px}
.stats div{text-align:center}.stats b{display:block;font:800 28px ui-monospace,Consolas,monospace;color:var(--ac)}.stats small{color:var(--mu);font-size:12px}
h2.sec{font-size:clamp(24px,4vw,34px);margin:36px 0 4px;font-weight:900}
.catname{color:var(--ac);font-weight:800;letter-spacing:.12em;font-size:12px;text-transform:uppercase;margin:26px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:left;cursor:pointer;display:block;width:100%}
.tc:hover{border-color:var(--ac);transform:translateY(-1px)}.tc b{display:block;font-size:16px;margin-bottom:4px}.tc span{color:var(--mu);font-size:13px}
.back{margin:16px 0 4px}
.tool h1{font-size:clamp(26px,5vw,40px);margin:8px 0 4px;font-weight:900}.tool .d{color:var(--mu);margin:0 0 16px}
.layout{display:grid;grid-template-columns:300px 1fr;gap:14px}
.panel,.vis,.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.vis{padding:0;overflow:hidden;background:var(--card2);min-height:120px}
label{display:block;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:12px 0 6px}
.f:first-child label{margin-top:0}
.sl{display:flex;gap:10px;align-items:center}
input[type=range]{flex:1;accent-color:var(--ac);min-width:0}
input.num,select{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:10px 11px;width:100%}
.sl input.num{width:110px;flex:none;font:700 15px ui-monospace,Consolas,monospace;color:var(--ac);text-align:right}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 11px;cursor:pointer;font-size:14px}
.chip.on{background:var(--or);color:#2a1800;border-color:var(--or);font-weight:800}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.cd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cd small{display:block;color:var(--mu);font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.cd b{display:block;font:800 22px ui-monospace,Consolas,monospace;color:var(--ac);margin-top:4px;word-break:break-word}
.note{color:var(--mu);font-size:13px;margin:12px 0 0}.warn{color:var(--or);font-size:13px;margin:12px 0 0}.err{color:var(--rd);margin:12px 0 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
svg{display:block;width:100%;height:auto}
table{width:100%;border-collapse:collapse;font:14px ui-monospace,Consolas,monospace}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mu);font-weight:700;font-size:12px}td:first-child,th:first-child{text-align:left}
.tw{overflow-x:auto}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pad button{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 4px;cursor:pointer;font-size:14px}
.pad button:hover,.pad button.on{border-color:var(--ac);background:#16301b}
td input,td select{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:5px 6px;width:100%;min-width:80px;font-size:13px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ac);color:#08210a;padding:10px 18px;border-radius:12px;font-weight:700;z-index:50}
footer{color:var(--mu);font-size:12px;text-align:center;padding:30px 0}
@media(max-width:820px){.hero{grid-template-columns:1fr}.layout{grid-template-columns:1fr}}
@media print{body{background:#fff;color:#000}header,.back,.panel,.actions,.noprint,footer,.cards{display:none!important}main{padding:0}.vis,.box{border:1px solid #999;background:#fff}.printonly{display:block!important}td,th{color:#000;border-color:#999}.cd b{color:#000}}
.printonly{display:none}
</style></head><body>
<header><button class="logo" id="home"><img src="icon.svg" alt=""><b>Dr<span>Robert</span></b></button>
<button class="hb" id="share">Udostępnij</button><button class="hb" id="u">mm</button></header>
<main id="app"></main>
<footer>DrRobert · działa offline · bez konta, bez reklam, bez śledzenia · narzędzie pomocnicze: obowiązuje WPS, norma i rysunek</footer>
<script src="calc.js"></script>
<script src="iso.js"></script>
<script src="app.js"></script>
</body></html>
