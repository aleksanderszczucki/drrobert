<!doctype html>
<html lang="pl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DrRobert – kalkulator rurarza</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0b1118">
<style>
:root{--bg:#0b1118;--card:#131c27;--line:#243346;--tx:#e8eef5;--mu:#8a9bb0;--ac:#7ed957;--or:#f5a623;--bl:#5ab4ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;align-items:center;gap:10px;z-index:5}
header h1{font-size:19px;margin:0;flex:1}header h1 span{color:var(--ac)}
button,select,input{font:inherit;color:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;scrollbar-width:none}
.tabs button{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:8px 14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#08210a;border-color:var(--ac);font-weight:700}
main{padding:0 16px 40px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
label{display:block;color:var(--mu);font-size:13px;margin:10px 0 4px}
input,select{width:100%;background:#0d151e;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus,select:focus{outline:2px solid var(--ac);border-color:var(--ac)}
.res{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.res div{background:#0d151e;border:1px solid var(--line);border-radius:10px;padding:10px}
.res small{display:block;color:var(--mu);font-size:12px}.res b{font:700 20px ui-monospace,Consolas,monospace;color:var(--ac)}
.unit{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
table{width:100%;border-collapse:collapse;font:14px ui-monospace,Consolas,monospace}td,th{padding:5px 6px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--mu);font-weight:600}
svg{width:100%;height:auto;display:block}.warn{color:var(--or);font-size:13px;margin-top:10px}.err{color:#ff7b7b}
h2{font-size:17px;margin:8px 0 0}p.n{color:var(--mu);font-size:13px;margin:4px 0 0}
</style></head><body>
<header><h1>Dr<span>Robert</span></h1><button class="unit" id="u">mm</button></header>
<div class="tabs" id="tabs"></div><main id="m"></main>
<script src="calc.js"></script>
<script>
const $ = s=>document.querySelector(s);
let unit = 'mm';
try { unit = localStorage.getItem('dr_unit')||'mm'; } catch(e){}
const store = (k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}, load = k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const num = id => parseFloat(String($('#'+id).value).replace(',','.'));
const f1 = x => x.toFixed(1);
const val = id => unit==='in' ? parseInches($('#'+id).value) : num(id);
const show = mm => (isNaN(mm)||!isFinite(mm)) ? '—' : (unit==='in' ? toFeetInches(mm) : f1(mm)+' mm');
const fld = (id,l,v,ang) => `<label for="${id}">${l}${ang?' (°)':unit==='in'?' (cale/stopy)':' (mm)'}</label><input id="${id}" inputmode="${unit==='in'&&!ang?'text':'decimal'}" value="${(ang||unit==='mm')?v:toFeetInches(v)}">`;
const out = (l,v)=>`<div><small>${l}</small><b>${v}</b></div>`;
const bad = m => `<p class="err">${m}</p>`;
const T = {
 odsun:{n:'Odsunięcie',h(){return `<h2>Odsunięcie dwoma kolanami</h2><p class="n">Dwa kolana w jednej płaszczyźnie.</p>
  ${fld('H','Odsunięcie (oś do osi)',260)}${fld('A','Kąt kolana',45,1)}${fld('R','Promień kolana R',70)}<div id="o"></div><div id="d"></div>
  <p class="warn">Sprawdź wymiar na stali przed cięciem.</p>`},
  run(){const H=val('H'),A=num('A'),R=val('R');
   if(!(H>0&&A>0&&A<90&&R>=0)){$('#o').innerHTML=bad('Podaj poprawne dane (kąt 1–89°).');$('#d').innerHTML='';return}
   const r=offset({H,angle:A,R});
   $('#o').innerHTML=(r.cut<=0?bad('Za krótko: kolana się stykają.'):'')+`<div class="res">${out('Rura do wycięcia',show(r.cut))+out('Odliczenie na kolano',show(r.take))+out('Środek–środek',show(r.travel))+out('Długość całkowita',show(r.total))}</div>`;
   const s=Math.min(240/r.run,100/H),x0=20,y0=135,xa=x0+60,xb=xa+r.run*s,y1=y0-H*s;
   $('#d').innerHTML=`<svg viewBox="0 0 400 160"><path d="M${x0} ${y0}H${xa}L${xb} ${y1}H${xb+60}" fill="none" stroke="#7ed957" stroke-width="10" stroke-linejoin="round"/><line x1="${xb+70}" y1="${y0}" x2="${xb+70}" y2="${y1}" stroke="#f5a623"/><text x="${xb+66}" y="${(y0+y1)/2}" fill="#f5a623" font-size="12" text-anchor="end">${show(H)}</text><text x="${xa+8}" y="${y0-10}" fill="#5ab4ff" font-size="12">${A}°</text></svg>`}},
 prostop:{n:'Odsunięcie przestrz.',h(){return `<h2>Odsunięcie przestrzenne</h2><p class="n">Wzniesienie + rozstaw (rolling offset).</p>${fld('S','Rozstaw (w bok)',400)}${fld('V','Wzniesienie (w górę)',300)}${fld('A','Kąt kolana',45,1)}<div id="o"></div>`},
  run(){const S=val('S'),V=val('V'),A=num('A');if(!(S>=0&&V>=0&&A>0&&A<90&&S+V>0)){$('#o').innerHTML=bad('Podaj poprawne dane.');return}
   const r=rolling({rise:V,spread:S,angle:A});$('#o').innerHTML=`<div class="res">${out('Odsunięcie rzeczywiste',show(r.trueOffset))+out('Środek–środek',show(r.travel))+out('Przesunięcie wzdłuż osi',show(r.run))+out('Obrót płaszczyzny',r.rollAngle.toFixed(1)+'°')}</div>`}},
 odgal:{n:'Odgałęzienie',h(){return `<h2>Odgałęzienie 90° (rozwinięcie)</h2><p class="n">Szablon do owinięcia rury odgałęzienia.</p>${fld('d','Średnica odgałęzienia',60.3)}${fld('D','Średnica rury głównej',114.3)}<label>Punktów na obwodzie</label><select id="p"><option>8</option><option selected>16</option><option>24</option></select><div id="o"></div>`},
  run(){const d=val('d'),D=val('D'),p=+$('#p').value;if(!(d>0&&D>0)){$('#o').innerHTML=bad('Podaj średnice.');return}
   try{const r=fishmouth({d,D,points:p});const mx=Math.max(...r.rows.map(x=>x.h))||1;
   const pts=r.rows.map(x=>`${20+x.arc/r.circumference*360},${20+(mx-x.h)/mx*100}`).join(' ');
   $('#o').innerHTML=`<div class="card"><p class="n">Obwód: <b>${show(r.circumference)}</b> · głębokość cięcia: <b>${show(mx)}</b></p><svg viewBox="0 0 400 140"><polyline points="${pts}" fill="none" stroke="#7ed957" stroke-width="2"/></svg>
   <table><tr><th>Nr</th><th>Wzdłuż obwodu</th><th>Od krawędzi</th></tr>${r.rows.map(x=>`<tr><td>${x.i}</td><td>${show(x.arc)}</td><td>${show(x.h)}</td></tr>`).join('')}</table></div>`}catch(e){$('#o').innerHTML=bad(e.message)}}},
 mitre:{n:'Kolano segmentowe',h(){return `<h2>Kolano z prostych odcinków</h2><p class="n">Kąt piły i długości segmentów (po osi).</p>${fld('A','Kąt kolana',90,1)}<label>Liczba cięć</label><select id="n"><option>2</option><option selected>3</option><option>4</option><option>5</option></select>${fld('R','Promień osi kolana R',150)}${fld('D','Średnica zewnętrzna',60)}<div id="o"></div>`},
  run(){const A=num('A'),n=+$('#n').value,R=val('R'),D=val('D');if(!(A>0&&A<=180&&R>0&&D>0)){$('#o').innerHTML=bad('Podaj poprawne dane.');return}
   const r=mitre({angle:A,cuts:n,R,D});$('#o').innerHTML=`<div class="res">${out('Kąt piły (cięcie)',r.sawAngle.toFixed(2)+'°')+out('Segment końcowy (oś)',show(r.endSeg))+out('Segment środkowy (oś)',show(r.midSeg))+out('Wysokość fali',show(r.waveHeight))}</div>`}},
 stozek:{n:'Stożek / redukcja',h(){return `<h2>Rozwinięcie stożka ściętego</h2>${fld('D','Średnica duża',200)}${fld('d','Średnica mała',100)}${fld('h','Wysokość',100)}<div id="o"></div><div id="g"></div>`},
  run(){const D=val('D'),d=val('d'),h=val('h');if(!(D>d&&d>=0&&h>0)){$('#o').innerHTML=bad('Średnica duża musi być większa od małej.');$('#g').innerHTML='';return}
   const r=cone({D,d,h});$('#o').innerHTML=`<div class="res">${out('Promień zewn. łuku',show(r.Rbig))+out('Promień wewn. łuku',show(r.Rsmall))+out('Kąt wycinka',r.sectorDeg.toFixed(1)+'°')+out('Cięciwa',show(r.chord))+out('Pochyła',show(r.slant))+out('Objętość',r.volumeL.toFixed(2)+' l')}</div>`;
   const k=170/r.Rbig,a=r.sectorDeg*Math.PI/180,cx=200,cy=10,P=(R,t)=>`${(cx+R*k*Math.sin(t-a/2)).toFixed(1)} ${(cy+R*k*Math.cos(t-a/2)).toFixed(1)}`,big=a>Math.PI?1:0,Rb=(r.Rbig*k).toFixed(1),Rs=(r.Rsmall*k).toFixed(1);
   $('#g').innerHTML=`<svg viewBox="0 0 400 200"><path d="M${P(r.Rbig,0)}A${Rb} ${Rb} 0 ${big} 0 ${P(r.Rbig,a)}L${P(r.Rsmall,a)}A${Rs} ${Rs} 0 ${big} 1 ${P(r.Rsmall,0)}Z" fill="none" stroke="#7ed957" stroke-width="2"/></svg>`}},
 spadek:{n:'Spadek',h(){return `<h2>Spadek – przeliczanie</h2><label for="t">Wpisz w jednostkach</label><select id="t"><option value="percent">%</option><option value="mmm">mm/m</option><option value="ratio">1 : n</option><option value="deg">stopnie</option></select><label for="v">Wartość</label><input id="v" inputmode="decimal" value="2"><div id="o"></div>`},
  run(){const v=num('v');if(!(v>0)){$('#o').innerHTML=bad('Podaj wartość większą od 0.');return}
   const r=slope({type:$('#t').value,value:v});$('#o').innerHTML=`<div class="res">${out('Procent',r.percent.toFixed(3)+' %')+out('mm na metr',r.mmPerM.toFixed(2))+out('1 : n','1 : '+r.ratio.toFixed(1))+out('Stopnie',r.deg.toFixed(3)+'°')}</div>`}},
 masa:{n:'Masa rury',h(){return `<h2>Masa i pojemność odcinka</h2>${fld('od','Średnica zewnętrzna',60.3)}${fld('w','Grubość ścianki',3.6)}${fld('l','Długość',6000)}<div id="o"></div>`},
  run(){const od=val('od'),w=val('w'),l=val('l');if(!(od>0&&w>0&&l>0)){$('#o').innerHTML=bad('Podaj wymiary.');return}
   try{const r=pipeMass({od,wall:w,length:l});$('#o').innerHTML=`<div class="res">${out('Masa stali',r.steelKg.toFixed(2)+' kg')+out('Masa na metr',r.kgPerM.toFixed(2)+' kg/m')+out('Średnica wewn.',show(r.id))+out('Woda w środku',r.waterL.toFixed(2)+' l')}</div>`}catch(e){$('#o').innerHTML=bad(e.message)}}},
 dylat:{n:'Dylatacja',h(){return `<h2>Wydłużenie cieplne (stal węglowa)</h2>${fld('l','Długość odcinka',10000)}<label for="dt">Zmiana temperatury (K)</label><input id="dt" inputmode="decimal" value="100"><div id="o"></div><p class="n">Współczynnik 12·10⁻⁶ 1/K. Dla innych materiałów wynik się różni.</p>`},
  run(){const l=val('l'),dt=num('dt');if(!(l>0)||isNaN(dt)){$('#o').innerHTML=bad('Podaj dane.');return}
   $('#o').innerHTML=`<div class="res">${out('Wydłużenie',show(expansion({length:l,dT:dt}).dL))}</div>`}},
 cale:{n:'Cale ↔ mm',h(){return `<h2>Konwerter</h2><label for="a">Cale / stopy (np. 4' 7 5/16")</label><input id="a" value="4' 7 5/16&quot;"><label for="b">Milimetry</label><input id="b" inputmode="decimal" value="1404.9">`},
  run(){},special:true}
};
function render(k){const t=T[k];$('#m').innerHTML=`<div class="card">${t.h()}</div>`;
 document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k));store('dr_tab',k);
 if(t.special){$('#a').oninput=()=>{const mm=parseInches($('#a').value);if(!isNaN(mm))$('#b').value=mm.toFixed(2)};$('#b').oninput=()=>{const mm=num('b');if(!isNaN(mm))$('#a').value=toFeetInches(mm)};return}
 $('#m').querySelectorAll('input,select').forEach(e=>e.addEventListener('input',t.run));t.run()}
$('#tabs').innerHTML=Object.entries(T).map(([k,t])=>`<button data-k="${k}">${t.n}</button>`).join('');
$('#tabs').onclick=e=>{if(e.target.dataset.k)render(e.target.dataset.k)};
const setU=()=>{$('#u').textContent=unit==='mm'?'mm':'cale'};setU();
$('#u').onclick=()=>{unit=unit==='mm'?'in':'mm';store('dr_unit',unit);setU();render(load('dr_tab')||'odsun')};
render(T[load('dr_tab')]?load('dr_tab'):'odsun');
if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js');
</script></body></html>
